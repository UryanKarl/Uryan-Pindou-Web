<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伊水_Uryan的拼豆图纸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* ============ 像素字体 ============ */
/* 正文字体 */
@font-face{
  font-family: 'HYPixel';
  src: url('fonts/zpix.ttf') format('truetype');
  font-display: swap;
}

/* 标题字体 */
@font-face{
  font-family: 'TaikoRun';
  src: url('fonts/taiko-run-heavy.ttf') format('truetype');
  font-display: swap;
}

  /* ============ 变量 & 基础 ============ */
  :root{
    --bg: #ffffff;
    --fg: #111111;
    --muted: #777777;
    --line: #d9d9d9;
    --soft: #f5f5f5;
    --dark: #000000;
  }
  *{ box-sizing: border-box; }
  html,body{ height: 100%; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  letter-spacing: 0.02em;
  font-family: 'HYPixel', "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", 黑体, sans-serif;
  font-size: 18px;                  /* 像素字体建议用整数倍字号，见下方说明 */
  -webkit-font-smoothing: none;     /* 像素字体关掉抗锯齿更清晰 */
    display: flex;
    flex-direction: column;
    min-height: 110vh;
  }
  img{ image-rendering: pixelated; }

  .wrap{
    width: 100%;
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ============ 顶部标题 ============ */
  .site-header{ padding: 48px 0 22px; }
  .site-title{
    margin: 0;
    font-size: 48px;
    line-height: 1.4;
    letter-spacing: 0.04em;
    text-align: left;
    font-weight: 400;
    font-family: 'TaikoRun', 'HYPixel', monospace;
  }
  .site-title a{ color: inherit; text-decoration: none; }
  .site-title a:hover{ opacity: .7; }

  main{
    flex: 1;
    padding-bottom: 48px;
  }

  /* ============ 筛选 Tab ============ */
  .filters{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 26px;
    position: relative;
    z-index: 5;
  }
  .filter{ position: relative; }
  .filter.open{ z-index: 30; }

  .filter-btn{
    font-family: inherit;
    font-size: 14px;
    line-height: 1;
    color: var(--fg);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 9px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .filter-btn:hover{ background: var(--soft); }
  .filter.open .filter-btn{
    background: var(--fg);
    border-color: var(--fg);
    color: #fff;
  }
  .caret{
    font-size: 10px;
    opacity: .75;
    transform: translateY(-1px);
  }

  .dropdown{
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 100%;
    margin: 0;
    padding: 4px;
    list-style: none;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 10px 28px rgba(0,0,0,.10);
    display: none;
    z-index: 40;
  }
  .filter.open .dropdown{ display: block; }
  .dropdown li{
    padding: 9px 14px;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    white-space: nowrap;
  }
  .dropdown li:hover{ background: var(--soft); color: var(--fg); }
  .dropdown li.selected{ background: #ededed; color: var(--fg); font-weight: 700; }

  /* ============ 作品网格 ============ */
  .grid{
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
  }
  @media (max-width: 820px){
    .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  }

  .card{
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .thumb{
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--soft);
    border: 1px solid var(--line);
    transition: border-color .15s;
  }
  .card:hover .thumb{ border-color: var(--fg); }
  .thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }
  .card:hover .thumb img{ transform: scale(1.035); }

  .thumb-name{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px 10px 9px;
    font-size: 13px;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));
    opacity: 0;
    transition: opacity .18s;
    pointer-events: none;
  }
  .card:hover .thumb-name{ opacity: 1; }
  @media (hover: none){
    .thumb-name{ opacity: 1; }
  }

  .empty{
    grid-column: 1 / -1;
    padding: 60px 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  /* ============ 详情页 ============ */
  .back{
    display: inline-block;
    margin-bottom: 26px;
    font-size: 14px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .back:hover{ color: var(--fg); border-bottom-color: var(--fg); }

  .detail{
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.9fr);
    gap: 44px;
    align-items: start;
  }
  @media (max-width: 880px){
    .detail{ grid-template-columns: 1fr; gap: 30px; }
  }

    border: 1px solid var(--line);
    background: var(--soft);
  }
  .cover img{
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }
  .work-name{
    margin: 18px 0 12px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .tags{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag{
    font-size: 13px;
    padding: 4px 9px;
    color: #333;
    background: #fafafa;
    border: 1px solid var(--line);
  }

  .previews{
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;

    margin: 0;
    display: block;

    overflow: hidden;
    background: var(--soft);
    border: 1px solid var(--line);

/* =========================================================
   2. 工具函数
   ========================================================= */

/* 确定性伪随机数 */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* 生成黑白灰像素风占位图（SVG DataURL）—— 真实图片缺失时兜底用 */
const artCache = new Map();
function artDataURL(seed, size = 800){
  const key = seed + '@' + size;
  if (artCache.has(key)) return artCache.get(key);

  const N = 14;
  const rnd = mulberry32(seed);
  const cell = size / N;
  const c = (N - 1) / 2;
  const maxD = Math.hypot(c, c);
  const shades = ['#141414', '#3c3c3c', '#6a6a6a', '#9a9a9a', '#c6c6c6'];

  let rects = '';
  for (let y = 0; y < N; y++){
    for (let x = 0; x < N; x++){
      const d = Math.hypot(x - c, y - c) / maxD;
      const v = Math.min(1, Math.max(0, d + (rnd() - 0.5) * 0.5));

      let fill = '#f6f6f6';
      if (v < 0.32)      fill = shades[0];
      else if (v < 0.50) fill = shades[1];
      else if (v < 0.66) fill = shades[2];
      else if (v < 0.80) fill = shades[3];
      else if (v < 0.90) fill = shades[4];

      const pad = cell * 0.11;
      const w = cell - pad * 2;
      rects += `<rect x="${(x*cell+pad).toFixed(1)}" y="${(y*cell+pad).toFixed(1)}" `
             + `width="${w.toFixed(1)}" height="${w.toFixed(1)}" `
             + `rx="${(w*0.24).toFixed(1)}" fill="${fill}"/>`;
    }
  }

  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`
    + `<rect width="100%" height="100%" fill="#fbfbfb"/>${rects}</svg>`;

  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  artCache.set(key, url);
  return url;
}

/* 图片加载失败时自动回退到占位图
   （error 事件不冒泡，必须用捕获阶段监听） */
document.addEventListener('error', function(e){
  const el = e.target;
  if (!el || el.tagName !== 'IMG') return;
  const fb = el.getAttribute('data-fallback');
  if (fb && el.getAttribute('src') !== fb){
    el.setAttribute('src', fb);
  }
}, true);

/* =========================================================
   3. 筛选状态
   ========================================================= */
const selected = {};
FILTER_GROUPS.forEach(g => { selected[g.key] = g.options[0]; });

function matchWork(w){
  return FILTER_GROUPS.every(g => {
    if (g.type === 'sort') return true;    // 排序组不参与过滤
    const v = selected[g.key];
    if (v === g.options[0]) return true;   // 第一项 = 不限
    return w[g.key] === v;
  });
}

/* =========================================================
   4. 首页
   ========================================================= */
let filtersEl = null;
const app = document.getElementById('app');

function buildFilters(){
  const box = document.createElement('div');
  box.className = 'filters';

  FILTER_GROUPS.forEach(g => {
    const f = document.createElement('div');
    f.className = 'filter';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-btn';
    btn.textContent = selected[g.key];

    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▾';
    btn.appendChild(caret);

    const ul = document.createElement('ul');
    ul.className = 'dropdown';

    g.options.forEach(opt => {
      const li = document.createElement('li');
      li.textContent = opt;
      if (opt === selected[g.key]) li.classList.add('selected');

      li.addEventListener('click', e => {
        e.stopPropagation();
        selected[g.key] = opt;
        closeAllDropdowns();
        refreshFilters();
        renderGrid();
      });
      ul.appendChild(li);
    });

    btn.addEventListener('click', e => {
      e.stopPropagation();
      const wasOpen = f.classList.contains('open');
      closeAllDropdowns();
      if (!wasOpen) f.classList.add('open');
    });

    f.appendChild(btn);
    f.appendChild(ul);
    box.appendChild(f);
  });

  return box;
}

function refreshFilters(){
  if (!filtersEl) return;
  const items = filtersEl.querySelectorAll('.filter');
  items.forEach((f, i) => {
    const g = FILTER_GROUPS[i];
    const btn = f.querySelector('.filter-btn');
    if (btn.firstChild && btn.firstChild.nodeType === 3){
      btn.firstChild.nodeValue = selected[g.key];
    }
    f.querySelectorAll('.dropdown li').forEach(li => {
      li.classList.toggle('selected', li.textContent === selected[g.key]);
    });
  });
}

function closeAllDropdowns(){
  document.querySelectorAll('.filter.open').forEach(f => f.classList.remove('open'));
}
document.addEventListener('click', closeAllDropdowns);

function renderGrid(){
  const grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';

const list = WORKS.filter(matchWork);

// 排序：从旧到新 / 从新到旧
const desc = selected.sort === '从新到旧';
list.sort((a, b) => desc ? b.seed - a.seed : a.seed - b.seed);

  if (!list.length){
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '暂无符合条件的图纸';
    grid.appendChild(p);
    return;
  }

  list.forEach(w => {
    /* 有真实封面就用真实封面，否则用占位图；加载失败也会自动回退 */
    const fallback = artDataURL(w.seed, 700);
    const coverSrc = w.cover || fallback;

    const a = document.createElement('a');
    a.className = 'card';
    a.href = '#/work/' + w.id;
    a.innerHTML =
      `<div class="thumb">
         <img src="${coverSrc}" data-fallback="${fallback}"
              alt="${w.name}拼豆图纸" loading="lazy">
         <span class="thumb-name">${w.name}</span>
       </div>`;
    grid.appendChild(a);
  });
}

function renderHome(){
  app.innerHTML = '';

  filtersEl = buildFilters();
  app.appendChild(filtersEl);

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.id = 'grid';
  app.appendChild(grid);

  renderGrid();
}

/* =========================================================
   5. 详情页
   ========================================================= */
function renderDetail(w){
  app.innerHTML = '';

  const back = document.createElement('a');
  back.className = 'back';
  back.href = '#/';
  back.textContent = '← 返回全部作品';
  app.appendChild(back);

  const detail = document.createElement('div');
  detail.className = 'detail';

  /* ---- 1 区：封面 + 名称 + 类别 ---- */
  const coverFallback = artDataURL(w.seed, 1000);
  const coverSrc = w.cover || coverFallback;

  const z1 = document.createElement('section');
  z1.className = 'zone-1';
  z1.innerHTML =
    `<div class="cover">
       <img src="${coverSrc}" data-fallback="${coverFallback}"
            alt="${w.name}拼豆图纸封面">
     </div>
     <h2 class="work-name">${w.name}</h2>
     <div class="tags">
       <span class="tag">${w.work}</span>
       <span class="tag">${w.attr}</span>
       <span class="tag">${w.size}</span>
       <span class="tag">${w.cat}</span>
     </div>`;

  /* ---- 2 区：详情图小预览 ---- */
  const z2 = document.createElement('section');
  z2.className = 'zone-2';

  const previews = document.createElement('div');
  previews.className = 'previews';

  /* 组装详情图列表：最多 15 张
     - 填了 detailImages 就用真实图
     - 没填就按 details 数量生成占位图
     - 每张图都带 data-fallback，加载失败自动回退 */
  let imgs = [];
  if (Array.isArray(w.detailImages) && w.detailImages.length){
    imgs = w.detailImages.slice(0, 15).map((src, i) => ({
      src,
      fallback: artDataURL(w.seed + (i + 1) * 97, 1000)
    }));
  } else {
    const count = Math.max(1, Math.min(15, w.details || 1));
    imgs = Array.from({ length: count }, (_, i) => {
      const u = artDataURL(w.seed + (i + 1) * 97, 1000);
      return { src: u, fallback: u };
    });
  }

  imgs.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'preview';
    btn.innerHTML =
      `<img src="${item.src}" data-fallback="${item.fallback}"
            alt="${w.name} 详情图 ${i + 1}" loading="lazy">`;

    btn.addEventListener('click', () => {
      const img = btn.querySelector('img');
      /* 用当前实际显示的图（可能已回退为占位图）打开灯箱 */
      openLightbox(img.getAttribute('src'), img.alt);
    });

    previews.appendChild(btn);
  });

  z2.appendChild(previews);

  detail.appendChild(z1);
  detail.appendChild(z2);
  app.appendChild(detail);
}

/* =========================================================
   6. 灯箱（放大查看）
   ========================================================= */
const lightbox = document.getElementById('lightbox');
const lbImg = lightbox.querySelector('img');
const lbClose = document.getElementById('lbClose');

function openLightbox(src, alt){
  lbImg.src = src;
  lbImg.alt = alt || '';
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lightbox.hidden = true;
  lbImg.src = '';
  document.body.style.overflow = '';
}
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !lightbox.hidden) closeLightbox();
});

/* =========================================================
   7. 路由
   ========================================================= */
function route(){
  closeLightbox();
  const hash = location.hash || '#/';
  const m = hash.match(/^#\/work\/([^/]+)$/);

  if (m){
    const w = WORKS.find(x => x.id === m[1]);
    if (w){
      renderDetail(w);
      window.scrollTo(0, 0);
      return;
    }
  }
  renderHome();
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
